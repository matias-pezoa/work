name: analisis-sesion tests

on:
  push:
    paths:
      - "analisis-sesion/**"
      - ".github/workflows/analisis-sesion-tests.yml"
  pull_request:
    paths:
      - "analisis-sesion/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analisis-sesion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analisis-sesion/requirements-dev.txt
      - name: Instalar dependencias de prueba
        run: |
          pip install -r requirements-dev.txt
          python -m spacy download es_core_news_md
      - name: Pruebas con sesión sintética
        run: pytest -q
