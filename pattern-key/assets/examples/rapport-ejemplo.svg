<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200">
  <!-- Rapport de ejemplo (repetible): fondo azul noche, flores naranja/rosa, hojas menta.
       Los elementos que tocan un borde se repiten en el borde opuesto para que el módulo empalme. -->
  <defs>
    <g id="flor">
      <circle cx="0" cy="-11" r="9" fill="#f07a2a"/>
      <circle cx="10.5" cy="-3.4" r="9" fill="#f07a2a"/>
      <circle cx="6.5" cy="8.9" r="9" fill="#f07a2a"/>
      <circle cx="-6.5" cy="8.9" r="9" fill="#f07a2a"/>
      <circle cx="-10.5" cy="-3.4" r="9" fill="#f07a2a"/>
      <circle r="6" fill="#ffe08a"/>
    </g>
    <g id="flor2">
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="#f2a7c3"/>
      <ellipse cx="0" cy="8" rx="5" ry="8" fill="#f2a7c3"/>
      <ellipse cx="-8" cy="0" rx="8" ry="5" fill="#f2a7c3"/>
      <ellipse cx="8" cy="0" rx="8" ry="5" fill="#f2a7c3"/>
      <circle r="4" fill="#c2185b"/>
    </g>
    <path id="hoja" d="M0 0 C 8 -10, 22 -10, 30 0 C 22 10, 8 10, 0 0 Z" fill="#5cc7a0"/>
  </defs>
  <rect width="200" height="200" fill="#1d2b5a"/>

  <!-- hojas -->
  <use href="#hoja" transform="translate(40 60) rotate(-30)"/>
  <use href="#hoja" transform="translate(130 150) rotate(140)"/>
  <use href="#hoja" transform="translate(150 40) rotate(60)"/>
  <use href="#hoja" transform="translate(70 170) rotate(-100)"/>
  <use href="#hoja" transform="translate(-10 120) rotate(10)"/>
  <use href="#hoja" transform="translate(190 120) rotate(10)"/>

  <!-- flores naranjas (la del borde se duplica en las 4 esquinas) -->
  <use href="#flor" transform="translate(60 100)"/>
  <use href="#flor" transform="translate(0 0)"/>
  <use href="#flor" transform="translate(200 0)"/>
  <use href="#flor" transform="translate(0 200)"/>
  <use href="#flor" transform="translate(200 200)"/>
  <use href="#flor" transform="translate(150 95) scale(0.7)"/>

  <!-- flores rosas (la del borde superior se repite abajo) -->
  <use href="#flor2" transform="translate(110 40)"/>
  <use href="#flor2" transform="translate(30 150)"/>
  <use href="#flor2" transform="translate(105 0) scale(0.8)"/>
  <use href="#flor2" transform="translate(105 200) scale(0.8)"/>
  <use href="#flor2" transform="translate(170 165) scale(0.6)"/>

  <!-- puntos blancos -->
  <g fill="#ffffff">
    <circle cx="20" cy="40" r="2.5"/><circle cx="90" cy="75" r="2"/>
    <circle cx="175" cy="70" r="2.5"/><circle cx="100" cy="130" r="2"/>
    <circle cx="55" cy="135" r="1.8"/><circle cx="145" cy="185" r="2.2"/>
    <circle cx="85" cy="185" r="2"/><circle cx="185" cy="140" r="1.8"/>
  </g>
</svg>
